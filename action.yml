name: go-benchmark-pr-action
description: 'Run go benchmarks on a PR, compare with the base branch, and write results as a comment. Fail the workflow if benchmarks regress below configured % threshold. Requires Go to be available on PATH (e.g. via actions/setup-go).'
inputs:
  token:
    description: Github token with permission to write PR comments
    required: true
  duration_threshold:
    description: 'Threshold for duration regression in % (use 0 for no threshold check)'
    required: false
    default: '0'
  memory_threshold:
    description: 'Threshold for memory-usage regression in % (use 0 for no threshold check)'
    required: false
    default: '0'
  allocs_threshold:
    description: 'Threshold for allocation count regression in % (use 0 for no threshold check)'
    required: false
    default: '0'
  benchmark_pattern:
    description: 'Pattern to match benchmarks to run'
    required: false
    default: '.'
  benchmark_package:
    description: 'Package to run benchmarks for'
    required: false
    default: './...'
  benchmark_seconds:
    description: 'Duration to run each benchmark for'
    required: false
    default: '1'
  benchmark_count:
    description: 'Number of times to run each benchmark (leave empty to use defaults)'
    required: false
    default: '0'
runs:
  using: composite
  steps:
    - name: Build benchmark-pr-action
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"
        go build -o "$RUNNER_TEMP/go-benchmark-pr-action" .

    - name: Run benchmarks
      shell: bash
      working-directory: ${{ github.workspace }}
      run: "$RUNNER_TEMP/go-benchmark-pr-action"
      env:
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_DURATION_THRESHOLD: ${{ inputs.duration_threshold }}
        INPUT_MEMORY_THRESHOLD: ${{ inputs.memory_threshold }}
        INPUT_ALLOCS_THRESHOLD: ${{ inputs.allocs_threshold }}
        INPUT_BENCHMARK_PATTERN: ${{ inputs.benchmark_pattern }}
        INPUT_BENCHMARK_PACKAGE: ${{ inputs.benchmark_package }}
        INPUT_BENCHMARK_SECONDS: ${{ inputs.benchmark_seconds }}
        INPUT_BENCHMARK_COUNT: ${{ inputs.benchmark_count }}
